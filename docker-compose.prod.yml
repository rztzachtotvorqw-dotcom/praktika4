# docker-compose.prod.yml
# Production стек: Mattermost v12.0.1 + PostgreSQL 15 (с поддержкой ARM64 через Rosetta)
services:
  mattermost:
    image: mattermost/mattermost-team-edition:12.0.1
    platform: linux/amd64
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://postgres:${DB_POSTGRES_PASSWORD}@mattermost-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_TEAMSSETTINGS_ENABLEOPENSERVER=false
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      - mattermost-postgres
    restart: unless-stopped

  mattermost-postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: mattermost-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - POSTGRES_DB=mattermost
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    name: mattermost_network
    external: true

volumes:
  mattermost_data:
    name: mattermost_data
    external: true
  mattermost_logs:
    name: mattermost_logs
    external: true
  postgres_data:
    name: postgres_data